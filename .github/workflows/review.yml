name: Automated AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  analyze_code:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::319310747432:role/GitHubActionsServiceRole # Replace with your IAM Role ARN
          aws-region: us-east-1

      - name: Extract Pull Request Diff
        id: diff
        run: |
          # With fetch-depth: 0, all commits are already local.
          # Just run the diff between the base and head SHAs.
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > pr.diff
          
          if [ ! -s pr.diff ]; then
            echo "No changes detected."
            echo "diff_content=No changes" >> $GITHUB_ENV
          else
            echo "diff_content<<EOF" >> $GITHUB_ENV
            cat pr.diff >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Send Diff to Lambda
        id: review
        env:
          LAMBDA_URL: ${{ secrets.AWS_LAMBDA_FUNCTION_URL }} # Stored
          diff_content: ${{ env.diff_content }} in GitHub Secrets
        run: |
          # Use Python to safely package and send the JSON payload
          python3 -c "
          import json, urllib.request, os
          
          diff_text = os.environ['diff_content']
          url = os.environ['LAMBDA_URL']
          
          if not url:
              print('Error: LAMBDA_URL is empty')
              exit(1)

          data = {'diff': diff_text}
          # Note: We send 'body' because your Lambda does json.loads(event.get('body'))
          payload = json.dumps({'body': json.dumps(data)})

          req = urllib.request.Request(
              url, 
              data=json.dumps({'body': json.dumps(data)}).encode('utf-8'), 
              headers={'Content-Type': 'application/json'}, 
              method='POST'
          )
          
          try:
              with urllib.request.urlopen(req) as response:
                  res = json.loads(response.read().decode('utf-8'))
                  # Handle both direct response or Lambda Proxy response
                  body = json.loads(res['body']) if 'body' in res else res
                  
                  # We print to a temporary file instead of GITHUB_ENV 
                  # to avoid issues with large AI responses
                  with open('review_output.txt', 'w') as f:
                      f.write(body.get('review', 'No review generated.'))
          except Exception as e:
              print(f'Request failed: {e}')
              exit(1)
          "
      - name: Save Review to Env
        run: |
          echo "REVIEW_RESULT<<EOF" >> $GITHUB_ENV
          cat review_output.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
      - name: Post Comment on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Automated AI PR Review

            ${{ env.REVIEW }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}