name: Automated AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  analyze_code:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::319310747432:role/GitHubActionsServiceRole # Replace with your IAM Role ARN
          aws-region: us-east-1

      - name: Extract Pull Request Diff
        id: diff
        run: |
          # Fetch the base branch explicitly so git can see it
          git fetch origin ${{ github.event.pull_request.base.ref }}
          
          # Compare the current state of the PR branch to the base branch
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr.diff
          
          if [ ! -s pr.diff ]; then
            echo "No changes detected."
            echo "diff_content=No changes" >> $GITHUB_ENV
          else
            echo "diff_content<<DISTINCT_DELIMITER" >> $GITHUB_ENV
            cat pr.diff >> $GITHUB_ENV
            echo "DISTINCT_DELIMITER" >> $GITHUB_ENV
            
            # Debug: Print the diff to the logs so you can see it!
            echo "--- DEBUG: DIFF START ---"
            cat pr.diff
            echo "--- DEBUG: DIFF END ---"
          fi

      - name: Send Diff to Lambda
        id: review
        env:
          # Use the actual Function Name instead of the URL
          LAMBDA_FUNCTION_NAME: "ai-pr-reviewer-dev"
          diff_content: ${{ env.diff_content }} in GitHub Secrets
        run: |
          # Install the AWS SDK for Python
          pip3 install boto3
          # Use Python to safely package and send the JSON payload
          python3 -c "
          import json, boto3, os, base64
          
          diff_text = os.environ['diff_content']
          function_name = os.environ['LAMBDA_FUNCTION_NAME']
          
          # Initialize Boto3 Client using the OIDC credentials from the previous step
          client = boto3.client('lambda', region_name='us-east-1')
          
          # Format the payload exactly how your Lambda expects it
          # Your Lambda does: body = json.loads(event.get('body', '{}'))
          payload = {
              'body': json.dumps({'diff': diff_text})
          }
          
          try:
              response = client.invoke(
                  FunctionName=function_name,
                  InvocationType='RequestResponse',
                  Payload=json.dumps(payload)
              )
              
              # Read the streaming response
              res_payload = json.loads(response['Payload'].read().decode('utf-8'))
              
              # Extract the 'body' from the Lambda Proxy response
              # Your Lambda returns: return {'statusCode': 200, 'body': json.dumps({'review': ...})}
              body = json.loads(res_payload['body'])
              
              with open('review_output.txt', 'w') as f:
                  f.write(body.get('review', 'No review generated.'))
                  
          except Exception as e:
              print(f'Invocation failed: {e}')
              exit(1)
          "
          
      - name: Post Comment on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          # Use the 'body-file' parameter instead of 'body'
          body-file: 'review_output.txt' 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}